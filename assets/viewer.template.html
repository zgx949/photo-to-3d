<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · 3D 预览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23252321'/%3E%3Cpath d='M16 6l8.5 4.9v10.2L16 26 7.5 21.1V10.9L16 6z' fill='none' stroke='%23e9e5dd' stroke-width='1.6'/%3E%3Cpath d='M16 6v20M7.5 10.9L16 16l8.5-5.1' stroke='%23e9e5dd' stroke-width='1.2' opacity='.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
  :root {
    --ink: #232120;
    --ink-soft: #5d5852;
    --line: rgba(35, 33, 32, .12);
    --paper: #e9e6e0;
    --floor: #d7d3cb;
    --accent: #6f7d6b;
    --panel: rgba(250, 248, 245, .82);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-weight: 400;
    background:
      radial-gradient(120% 82% at 50% 8%, #f1eee8 0%, var(--paper) 46%, #e2ded6 72%, var(--floor) 100%);
  }

  /* 展台：壁与地之间的柔和过渡，不用渐变炫技 */
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  /* ===== 视图：顶部信息 ===== */
  .masthead {
    position: fixed;
    top: clamp(18px, 3.4vh, 34px);
    left: clamp(18px, 3vw, 42px);
    max-width: min(46vw, 420px);
    pointer-events: none;
    z-index: 3;
  }

  .masthead .kicker {
    font-size: 11.5px;
    letter-spacing: .14em;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }

  .masthead h1 {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    font-weight: 600;
    font-size: clamp(24px, 3.4vw, 40px);
    line-height: 1.15;
    margin: 0 0 10px;
    letter-spacing: .01em;
  }

  .masthead p {
    margin: 0;
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink-soft);
    max-width: 34ch;
  }

  .specs {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .specs span { display: inline-flex; align-items: center; gap: 6px; }

  .specs .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent);
    opacity: .55;
  }

  /* ===== 视图：控制条 ===== */
  .dock {
    position: fixed;
    left: 50%;
    bottom: clamp(16px, 3vh, 30px);
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 5px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px) saturate(1.1);
    -webkit-backdrop-filter: blur(14px) saturate(1.1);
    box-shadow: 0 1px 2px rgba(35,33,32,.06), 0 12px 32px -18px rgba(35,33,32,.5);
    z-index: 4;
  }

  .dock button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 12.5px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color .18s ease, color .18s ease;
    white-space: nowrap;
  }

  .dock button:hover { background: rgba(35,33,32,.055); color: var(--ink); }

  .dock button[aria-pressed="true"] {
    background: rgba(111,125,107,.14);
    color: #46523f;
  }

  .dock button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .dock .sep {
    width: 1px; height: 18px;
    background: var(--line);
    margin: 0 3px;
  }

  .dock svg { width: 15px; height: 15px; flex: none; }

  /* 提示行 */
  .hint {
    position: fixed;
    right: clamp(18px, 3vw, 42px);
    bottom: clamp(22px, 3vh, 36px);
    font-size: 11.5px;
    color: var(--ink-soft);
    opacity: .75;
    text-align: right;
    line-height: 1.7;
    pointer-events: none;
    z-index: 3;
  }

  @media (max-width: 860px) {
    .masthead { max-width: 62vw; }
    .masthead p { display: none; }
    .hint { display: none; }
    .dock button span { display: none; }
    .dock button { padding: 10px; }
  }

  /* ===== 视图：加载 / 错误 / 拖放 ===== */
  .veil {
    position: fixed; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: linear-gradient(180deg, #efece6, #e3dfd7);
    color: var(--ink-soft);
    font-size: 13px;
    letter-spacing: .02em;
    z-index: 5;
    transition: opacity .5s ease, visibility .5s ease;
  }

  .veil.gone { opacity: 0; visibility: hidden; }

  .trace {
    width: 128px; height: 1px;
    background: var(--line);
    position: relative;
    overflow: hidden;
  }

  .trace::after {
    content: "";
    position: absolute; inset: 0;
    background: var(--ink);
    transform: translateX(-100%);
    animation: sweep 1.5s cubic-bezier(.45,0,.25,1) infinite;
  }

  @keyframes sweep {
    0% { transform: translateX(-100%); }
    60%, 100% { transform: translateX(100%); }
  }

  .error-box {
    max-width: 380px;
    text-align: center;
    line-height: 1.8;
    font-size: 13px;
    color: var(--ink);
  }

  .dropzone {
    position: fixed; inset: 14px;
    border: 1px dashed rgba(35,33,32,.32);
    border-radius: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(240, 237, 231, .88);
    z-index: 6;
    font-size: 13px;
    letter-spacing: .04em;
  }

  .dropzone.on { display: flex; }

  .toast {
    position: fixed;
    top: 26px; left: 50%;
    transform: translate(-50%, -12px);
    background: rgba(35,33,32,.92);
    color: #f4f1ea;
    font-size: 12.5px;
    padding: 9px 16px;
    border-radius: 6px;
    opacity: 0;
    transition: opacity .28s ease, transform .28s ease;
    pointer-events: none;
    z-index: 7;
  }

  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .trace::after { animation: none; transform: none; opacity: .5; }
    .veil, .toast { transition: none; }
  }
</style>
</head>
<body>

<div id="stage" aria-label="3D 模型预览，可拖拽旋转、滚轮缩放"></div>

<div class="masthead">
  <p class="kicker">照片转 3D · Seed3D 2.0</p>
  <h1>__TITLE__</h1>
  <p>__BLURB__</p>
  <div class="specs" id="specs">
    <span><i class="dot"></i><em id="spec-tris" style="font-style:normal">—</em> 三角面</span>
    <span><i class="dot"></i><em id="spec-mats" style="font-style:normal">—</em> 套 PBR 材质</span>
    <span><i class="dot"></i><em id="spec-size" style="font-style:normal">—</em> 载入体积</span>
  </div>
</div>

<div class="dock" role="toolbar" aria-label="模型控制">
  <button id="btn-rotate" aria-pressed="true" title="自动旋转">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 4v4.5h-4.5"/></svg>
    <span>自动旋转</span>
  </button>
  <button id="btn-wire" aria-pressed="false" title="线框模式">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l8 4.6v9.8L12 21l-8-4.6V7.6L12 3z"/><path d="M4 7.6L12 12l8-4.4M12 12v9"/></svg>
    <span>线框</span>
  </button>
  <div class="sep" aria-hidden="true"></div>
  <button id="btn-reset" title="回到初始视角">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9V4h5"/><path d="M4.5 8.2A9 9 0 1 1 3 14"/></svg>
    <span>复位视角</span>
  </button>
  <button id="btn-download" title="下载 glb">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 18.5h16"/></svg>
    <span>下载 glb</span>
  </button>
</div>

<div class="hint">拖拽旋转 · 滚轮缩放 · 双击复位<br>也可以直接把 .glb 文件拖进来查看</div>

<div class="veil" id="veil">
  <div class="trace"></div>
  <div id="veil-text">解析模型…</div>
</div>

<div class="dropzone" id="dropzone">松手载入模型</div>
<div class="toast" id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://fastly.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://fastly.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>

<!-- 模型原始数据（Draco 压缩 + WebP 贴图，面数 499,994 未简化） -->
<script id="glb-payload" type="text/plain">__GLB_B64__</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const stage = document.getElementById('stage');
const veil = document.getElementById('veil');
const veilText = document.getElementById('veil-text');
const specsTris = document.getElementById('spec-tris');
const specsMats = document.getElementById('spec-mats');
const specsSize = document.getElementById('spec-size');
const toastEl = document.getElementById('toast');

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 渲染器 ---------- */
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
stage.appendChild(renderer.domElement);

/* ---------- 场景与相机 ---------- */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(0.9, 0.9, 2.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.75;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 1.15;
/* 给极角与距离设限：任何角度都是成立的构图，转不到地底、也穿不进模型 */
controls.minPolarAngle = 0.22;
controls.maxPolarAngle = 1.46;
controls.enablePan = false;

/* ---------- 环境：中性影棚，无 HDR 文件 ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;

/* ---------- 三点光 ---------- */
const key = new THREE.DirectionalLight(0xfff3e4, 2.7);
key.position.set(0.9, 6.0, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 12;
key.shadow.camera.left = -1.8;
key.shadow.camera.right = 1.8;
key.shadow.camera.top = 1.8;
key.shadow.camera.bottom = -1.8;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.025;
key.shadow.radius = 9;
key.shadow.blurSamples = 20;
scene.add(key);

const fill = new THREE.DirectionalLight(0xdfe7f2, 0.5);
fill.position.set(-3.4, 1.6, -1.4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.1);
rim.position.set(-1.2, 2.6, -4.2);
scene.add(rim);

/* 接触处的暗：只落影子，不铺一层灰 */
const floor = new THREE.Object3D();
floor.position.y = 0;
scene.add(floor);

/* 接地投影载体 */
const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 4),
  new THREE.ShadowMaterial({ color: 0x2a2724, opacity: 0.2 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = 0.001;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

/* ---------- 加载器 ---------- */
const draco = new DRACOLoader();
draco.setDecoderPath('https://fastly.jsdelivr.net/npm/three@0.160.1/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

let model = null;
let currentBuffer = null;
let wireframe = false;
let initialView = null;

function setSpecs({ tris, mats, size }) {
  if (tris != null) specsTris.textContent = tris.toLocaleString('zh-CN');
  if (mats != null) specsMats.textContent = String(mats);
  if (size != null) specsSize.textContent = size;
}

function disposeModel() {
  if (!model) return;
  scene.remove(model);
  model.traverse((o) => {
    if (o.isMesh) {
      o.geometry?.dispose();
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((m) => {
        if (!m) return;
        ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap'].forEach((k) => m[k]?.dispose());
        m.dispose();
      });
    }
  });
  model = null;
}

function frameCamera(object3d, radiusOverride) {
  const box = new THREE.Box3().setFromObject(object3d);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);
  const radius = radiusOverride ?? Math.max(size.x, size.y, size.z) * 0.72;

  const fovRad = THREE.MathUtils.degToRad(camera.fov);
  // 由主体尺寸推距离：竖向与横向各算一次，取更紧的那个，不套固定值
  const halfH = Math.max(size.y, 0.001) / 2;
  const halfW = Math.max(size.x, size.z, 0.001) / 2;
  const fitH = halfH / Math.tan(fovRad / 2);
  const fitW = halfW / (Math.tan(fovRad / 2) * camera.aspect);
  const dist = Math.max(fitH, fitW) * 1.52;

  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(0.34, 0.26, 1).normalize().multiplyScalar(dist));
  camera.near = Math.max(dist * 0.02, 0.01);
  camera.far = dist * 8;
  camera.updateProjectionMatrix();

  controls.minDistance = dist * 0.45;
  controls.maxDistance = dist * 2.2;
  controls.update();

  initialView = {
    pos: camera.position.clone(),
    target: center.clone(),
    min: controls.minDistance,
    max: controls.maxDistance,
    near: camera.near,
    far: camera.far
  };
}

function countTris(root) {
  let tris = 0;
  root.traverse((o) => {
    if (o.isMesh && o.geometry) {
      const g = o.geometry;
      if (g.index) tris += g.index.count / 3;
      else if (g.attributes.position) tris += g.attributes.position.count / 3;
    }
  });
  return Math.round(tris);
}

function applyWireframe(flag) {
  model?.traverse((o) => {
    if (o.isMesh) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((m) => { if (m) { m.wireframe = flag; m.needsUpdate = true; } });
    }
  });
}

function onLoaded(gltf, label, bytes) {
  disposeModel();
  model = gltf.scene;

  /* 落地：贴地、居中 */
  const box = new THREE.Box3().setFromObject(model);
  const center = new THREE.Vector3();
  box.getCenter(center);
  model.position.x -= center.x;
  model.position.z -= center.z;
  model.position.y -= box.min.y;

  model.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((m) => {
        if (!m) return;
        m.envMapIntensity = 0.85;
        m.envMap = scene.environment;
        m.needsUpdate = true;
      });
    }
  });
  scene.add(model);

  const box2 = new THREE.Box3().setFromObject(model);
  shadowPlane.scale.setScalar(Math.max(box2.max.x - box2.min.x, 0.4) * 2.4);

  frameCamera(model);
  applyWireframe(wireframe);

  setSpecs({
    tris: countTris(model),
    mats: (() => {
      const set = new Set();
      model.traverse((o) => {
        if (o.isMesh && o.material) {
          (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => set.add(m.uuid));
        }
      });
      return set.size;
    })(),
    size: bytes != null ? formatBytes(bytes) : label || '—'
  });

  veil.classList.add('gone');
}

function formatBytes(n) {
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}

function showError(msg) {
  veil.classList.remove('gone');
  veilText.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'error-box';
  box.textContent = msg;
  veil.appendChild(box);
}

function parseGlb(buffer, label, bytes) {
  veil.classList.remove('gone');
  veilText.textContent = '解析模型…';
  loader.parse(buffer, '', (gltf) => {
    onLoaded(gltf, label, bytes);
  }, (err) => {
    console.error(err);
    showError('这个文件没能解析成 glTF/GLB。请确认它是 .glb 或 .gltf，且不是 Draco 之外的私有压缩格式。');
  });
}

/* ---------- 内置模型 ---------- */
function base64ToArrayBuffer(b64) {
  const raw = atob(b64.trim());
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  return bytes.buffer;
}

try {
  const payload = document.getElementById('glb-payload').textContent.trim();
  currentBuffer = base64ToArrayBuffer(payload);
  parseGlb(currentBuffer, '内置模型', currentBuffer.byteLength);
} catch (e) {
  console.error(e);
  showError('内置模型数据读取失败。');
}

/* ---------- 交互 ---------- */
const btnRotate = document.getElementById('btn-rotate');
const btnWire = document.getElementById('btn-wire');
const btnReset = document.getElementById('btn-reset');
const btnDownload = document.getElementById('btn-download');

btnRotate.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnRotate.setAttribute('aria-pressed', String(controls.autoRotate));
  toast(controls.autoRotate ? '自动旋转：开' : '自动旋转：关');
});

btnWire.addEventListener('click', () => {
  wireframe = !wireframe;
  applyWireframe(wireframe);
  btnWire.setAttribute('aria-pressed', String(wireframe));
});

btnReset.addEventListener('click', resetView);
renderer.domElement.addEventListener('dblclick', resetView);

function resetView() {
  if (!initialView) return;
  camera.position.copy(initialView.pos);
  controls.target.copy(initialView.target);
  controls.minDistance = initialView.min;
  controls.maxDistance = initialView.max;
  controls.update();
  toast('视角已复位');
}

btnDownload.addEventListener('click', () => {
  if (!currentBuffer) return;
  const blob = new Blob([currentBuffer], { type: 'model/gltf-binary' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'figure-3d.glb';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('已导出 glb');
});

/* 拖入自己的模型 */
const dropzone = document.getElementById('dropzone');
let dragDepth = 0;

window.addEventListener('dragover', (e) => {
  e.preventDefault();
  if (!e.dataTransfer?.types?.includes('Files')) return;
  dropzone.classList.add('on');
});

window.addEventListener('dragleave', (e) => {
  if (e.relatedTarget === null) dropzone.classList.remove('on');
});

window.addEventListener('drop', async (e) => {
  e.preventDefault();
  dropzone.classList.remove('on');
  const file = e.dataTransfer?.files?.[0];
  if (!file) return;
  if (!/\.(glb|gltf)$/i.test(file.name)) {
    toast('只接受 .glb / .gltf 文件');
    return;
  }
  const buffer = await file.arrayBuffer();
  currentBuffer = buffer;
  parseGlb(buffer, file.name, file.size);
  toast('已载入 ' + file.name);
});

/* ---------- 提示 ---------- */
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1800);
}

/* ---------- 尺寸 ---------- */
let resizeFrame = null;
window.addEventListener('resize', () => {
  if (resizeFrame) cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
});

/* ---------- 渲染循环：后台停掉 ---------- */
let rafId = null;

function tick() {
  rafId = requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
}

function startLoop() {
  if (rafId == null) tick();
}

function stopLoop() {
  if (rafId != null) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopLoop();
  else startLoop();
});

startLoop();
</script>
